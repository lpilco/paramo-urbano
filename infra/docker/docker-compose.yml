version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: paramo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-paramo_db}
      POSTGRES_USER: ${DB_USER:-paramo_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paramo_secure_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paramo_admin} -d ${DB_NAME:-paramo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paramo_network

  redis:
    image: redis:7-alpine
    container_name: paramo_redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-paramo_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - paramo_network

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: paramo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - paramo_network

networks:
  paramo_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
