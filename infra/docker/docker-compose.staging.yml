version: "3.8"

# ==============================================================================
# PÁRAMO URBANO (v2.0.0 Core) — Staging & Pre-Production Orchestration
# "Donde el asfalto toca la cumbre"
#
# Configured for Phase 2 Technical Beta Cohort:
# 100 Athletes (40 Road, 40 Trail, 20 Hiking) with concurrency emulations.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: paramo_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-paramo_db}
      POSTGRES_USER: ${DB_USER:-paramo_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paramo_secure_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paramo_admin} -d ${DB_NAME:-paramo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - paramo_staging_net

  # ----------------------------------------------------------------------------
  # 2. Asynchronous Queue & Cache Engine (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: paramo_staging_redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-paramo_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - paramo_staging_net

  # ----------------------------------------------------------------------------
  # 3. Object Storage Engine (MinIO S3 Compatible)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: paramo_staging_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - paramo_staging_net

  # ----------------------------------------------------------------------------
  # 4. Core Backend REST API (FastAPI Gateway)
  # ----------------------------------------------------------------------------
  backend_api:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    image: paramo-urbano-backend:staging
    container_name: paramo_staging_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-paramo_admin}:${DB_PASSWORD:-paramo_secure_pass}@postgres:5432/${DB_NAME:-paramo_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-paramo_redis_pass}
      REDIS_URL: redis://:${REDIS_PASSWORD:-paramo_redis_pass}@redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass}
      STORAGE_BUCKET_RAW_ACTIVITIES: ${STORAGE_BUCKET_RAW_ACTIVITIES:-paramo-raw-telemetry}
      JWT_SECRET: ${JWT_SECRET:-staging_secret_jwt_key_paramo_urban_2026}
      MAX_UPLOAD_FILE_SIZE_BYTES: 26214400
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M
    networks:
      - paramo_staging_net

  # ----------------------------------------------------------------------------
  # 5. Autonomous Asynchronous Telemetry Ingestion Worker
  # ----------------------------------------------------------------------------
  backend_worker:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    image: paramo-urbano-worker:staging
    container_name: paramo_staging_backend_worker
    restart: unless-stopped
    command: ["python", "-m", "backend.src.infrastructure.queue.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-paramo_admin}:${DB_PASSWORD:-paramo_secure_pass}@postgres:5432/${DB_NAME:-paramo_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-paramo_redis_pass}
      REDIS_URL: redis://:${REDIS_PASSWORD:-paramo_redis_pass}@redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass}
      STORAGE_BUCKET_RAW_ACTIVITIES: ${STORAGE_BUCKET_RAW_ACTIVITIES:-paramo-raw-telemetry}
      JWT_SECRET: ${JWT_SECRET:-staging_secret_jwt_key_paramo_urban_2026}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - paramo_staging_net

  # ----------------------------------------------------------------------------
  # 6. Frontend Web SPA & Nginx Gateway
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile
    image: paramo-urbano-frontend:staging
    container_name: paramo_staging_frontend
    restart: unless-stopped
    depends_on:
      backend_api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - paramo_staging_net

networks:
  paramo_staging_net:
    driver: bridge
    name: paramo_staging_network

volumes:
  staging_postgres_data:
    name: paramo_staging_postgres_data
  staging_redis_data:
    name: paramo_staging_redis_data
  staging_minio_data:
    name: paramo_staging_minio_data
