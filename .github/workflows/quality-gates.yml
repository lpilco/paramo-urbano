name: Unified Quality Gate Certification — Master Suite

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate-certification:
    name: 5-Stage Quality Gate & NFR Certification (PRD v2.0.0 Core)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paramo_test_db
          POSTGRES_USER: paramo_admin
          POSTGRES_PASSWORD: paramo_secure_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://paramo_admin:paramo_secure_pass@localhost:5432/paramo_test_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: quality_gate_deterministic_jwt_secret_test_key_2026
      STORAGE_BUCKET_RAW_ACTIVITIES: paramo-raw-telemetry

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js Runtime (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Grant Execute Permission to Certification Runner
        run: chmod +x infra/scripts/run_quality_gate.sh

      - name: Execute Unified Quality Gate Certification Script (Stages 1 to 5)
        run: ./infra/scripts/run_quality_gate.sh
